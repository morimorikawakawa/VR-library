    <!-- 360度写真を見るためのPannellum -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    >

    <style>

        body {
            margin: 0;
            font-family: sans-serif;
            background: #222;
        }


        /* 360度写真 */

        #panorama {
            width: 100vw;
            height: 100vh;
        }


        /* 現在地 */

        #location-name {

            position: absolute;

            top: 20px;
            left: 20px;

            z-index: 10;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            padding: 12px 20px;

            border-radius: 10px;

            font-size: 24px;

            font-weight: bold;
        }


        /* ボタンを置く場所 */

        .buttons {

            position: absolute;

            bottom: 30px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: flex;

            gap: 15px;

            flex-wrap: wrap;

            justify-content: center;

            max-width: 90%;
        }


        /* ボタン */

        .move-button {

            border: none;

            border-radius: 12px;

            padding: 14px 24px;

            background: white;

            color: #333;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }



      .move-button:hover {

            background: #eeeeee;

        }


        /* =====================================
           館内地図
           ===================================== */

        #map-container {

            position: absolute;

            top: 20px;

            right: 20px;

            width: 320px;

            z-index: 20;

            background: white;

            padding: 10px;

            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.4);

        }


        #map-image {

            width: 100%;

            display: block;

            border-radius: 6px;

        }


        /* 現在地を示す赤い丸 */

#map-marker {

    position: absolute;

    width: 18px;

    height: 18px;

    background: red;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow: 0 2px 6px rgba(0,0,0,0.5);

    transform: translate(-50%, -50%);

    z-index: 30;

}





    </style>

</head>

        /*
        ==================================================
        ★ ここで「どの通路にどの本棚があるか」を設定します
        ==================================================

        今は仮に、
        A → 本棚1～3
        B → 本棚4～6

        というように設定しています。

        実際の図書館の配置が分かったら、
        ここだけ変更すればOKです。
        ==================================================
        */

        const corridorShelves = {

            A: [ ],

            C: ["1","2","3"],

            D: ["4","5"],

            F: ["8","9","10"],

        };








        /*

        ==================================================
        */

        let currentType = "corridor";

        let currentLocation = "A";

        let previousCorridor = "A";


        /*
==================================================

==================================================
*/

  /*==================================================
                         赤い丸を移動
    ==================================================*/

function updateMapMarker(location) {

    const marker = document.getElementById("map-marker");

    const position = mapPositions[location];

    if (!position) {

        return;

    }

    marker.style.left = position.x + "%";

    marker.style.top = position.y + "%";

}


        /*
        ==================================================
        360度写真を表示
        ==================================================
        */

        let viewer = pannellum.viewer("panorama", {

            type: "equirectangular",

            panorama: corridors.A.image,

            autoLoad: true,

            showControls: true,

            compass: false

        });



        /*
        ==================================================
        写真を変更する
        ==================================================
        */

        function changePhoto(image) {

            viewer.destroy();

            viewer = pannellum.viewer("panorama", {

                type: "equirectangular",

                panorama: image,

                autoLoad: true,

                showControls: true,

                compass: false

            });

        }



        /*
        ==================================================
        通路へ移動
        ==================================================
        */

        function moveToCorridor(location) {

            currentType = "corridor";

            currentLocation = location;

            const data = corridors[location];

            changePhoto(data.image);

            document.getElementById("location-name").textContent =
                "現在地：" + data.name;

            createButtons();
            updateMapMarker(location);

        }



        /*
        ==================================================
        本棚へ移動
        ==================================================
        */

        function moveToShelf(number) {

            currentType = "shelf";

            currentLocation = number;

            const data = shelves[number];

            /*
            本棚へ入る前の通路を記録
            */

            previousCorridor = getCorridorFromShelf(number);

        /*
本棚の写真を表示
*/

if (data.image) {

    // 通常の写真がある本棚
    changePhoto(data.image);

} else {

    // 上・下の写真しかない本棚
    changePhoto("blank.jpg");

}

document.getElementById("location-name").textContent =
    data.image
        ? data.name
        : data.name + "　うえかしたをえらんでください";

createButtons();
updateMapMarker("shelf" + number);}



        /*
        ==================================================
        本棚から通路へ戻る
        ==================================================
        */

        function backToCorridor() {

            moveToCorridor(previousCorridor);

        }



        /*
        ==================================================
        本棚がどの通路につながっているか調べる
        ==================================================
        */

        function getCorridorFromShelf(number) {

            for (const corridor in corridorShelves) {

                if (corridorShelves[corridor].includes(number)) {

                    return corridor;

                }

            }

            return "A";

        }



        /*
        ==================================================
        上の写真を見る
        ==================================================
        */

        function showHigh() {

            const data = shelves[currentLocation];

            if (data.high) {

                changePhoto(data.high);

                document.getElementById("location-name").textContent =
                    data.name + "（上）";

            }

        }



        /*
        ==================================================
        下の写真を見る
        ==================================================
        */

        function showLow() {

            const data = shelves[currentLocation];

            if (data.low) {

                changePhoto(data.low);

                document.getElementById("location-name").textContent =
                    data.name + "（下）";

            }

        }



        /*
        ==================================================
        ボタンを作る
        ==================================================
        */

        function createButtons() {

            const buttons =
                document.getElementById("buttons");

            buttons.innerHTML = "";



            /*
            ==============================================
            通路にいる場合
            ==============================================
            */

            if (currentType === "corridor") {


                /*
                -------------------------
                すすむ
                -------------------------
                */

                const currentCode =
                    currentLocation.charCodeAt(0);

                const nextCode =
                    currentCode + 1;


                if (nextCode <= "P".charCodeAt(0)) {

                    const nextLocation =
                        String.fromCharCode(nextCode);


                    const button =
                        document.createElement("button");

                    button.className = "move-button";

                    button.textContent = "すすむ";

                    button.onclick = function() {

                        moveToCorridor(nextLocation);

                    };

                    buttons.appendChild(button);

                }


            // PにいるときはCへ進む
            if (currentLocation === "P") {

            const button = document.createElement("button");

            button.className = "move-button";

            button.textContent = "すすむ";

            button.onclick = function() {

                moveToCorridor("C");

            };

            buttons.appendChild(button);
            }

                /*
                -------------------------
                もどる
                -------------------------
                */

                if (currentCode > "A".charCodeAt(0)) {

                    const previousLocation =
                        String.fromCharCode(currentCode - 1);


                    const button =
                        document.createElement("button");

                    button.className = "move-button";

                    button.textContent = "もどる";

                    button.onclick = function() {

                        moveToCorridor(previousLocation);

                    };

                    buttons.appendChild(button);

                }



                /*
                -------------------------
                本棚を見る
                -------------------------
                */

                const shelfList =
                    corridorShelves[currentLocation];


                shelfList.forEach(function(number) {

                    const button =
                        document.createElement("button");

                    button.className = "move-button";

                    button.textContent =
                        "ほんだな" + number;

                    button.onclick = function() {

                        moveToShelf(number);
                    };

                    buttons.appendChild(button);

                });

            }



            /*
            ==============================================
            本棚にいる場合
            ==============================================
            */

            if (currentType === "shelf") {

                const data =
                    shelves[currentLocation];



                /*
                -------------------------
                上を見る
                -------------------------
                */

                if (data.high) {

                    const button =
                        document.createElement("button");

                    button.className = "move-button";

                    button.textContent = "うえをみる";

                    button.onclick = function() {

                        showHigh();

                    };

                    buttons.appendChild(button);

                }



                /*
                -------------------------
                下を見る
                -------------------------
                */

                if (data.low) {

                    const button =
                        document.createElement("button");

                    button.className = "move-button";

                    button.textContent = "したをみる";

                    button.onclick = function() {

                        showLow();

                    };

                    buttons.appendChild(button);

                }



                /*
                -------------------------
                通路へ戻る
                -------------------------
                */

                const backButton =
                    document.createElement("button");

                backButton.className = "move-button";

                backButton.textContent = "つうろにもどる";

                backButton.onclick = function() {

                    backToCorridor();

                };

                buttons.appendChild(backButton);

            }

        }



        /*
        ==================================================
        最初のボタンを表示
        ==================================================
        */

        createButtons();
        updateMapMarker(currentLocation);
